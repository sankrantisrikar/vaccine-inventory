<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaccine Inventory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Rx</div>
      <div><div class="brand-name">VaxLedger</div><div class="brand-sub" id="practiceName">Pediatric inventory</div></div>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      <a href="#/readiness" data-view="readiness">Readiness <span class="nav-badge" id="navReadiness"></span></a>
      <a href="#/visits" data-view="visits">Visits</a>
      <a href="#/inventory" data-view="inventory">Inventory</a>
      <a href="#/orders" data-view="orders">Orders</a>
      <a href="#/billing" data-view="billing">Billing &amp; loss</a>
      <a href="#/patients" data-view="patients">Patients</a>
      <a href="#/audit" data-view="audit">Audit log</a>
    </nav>
    <div class="sidebar-foot">
      <div class="muted small" id="todayLabel"></div>
      <div id="dataBanner" class="small"></div>
      <button class="btn ghost small hidden" id="resetBtn" title="Regenerate demo data">Reset demo data</button>
    </div>
  </aside>
  <main class="main" id="main"><div class="loading">Loading…</div></main>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<script src="app.js"></script>
</body>
</html>
